<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">OpenCleanup Maven Plugin</title>
  <desc id="desc">Deterministic, Lombok-aware Java formatting, cleanup, and refactoring for Maven builds.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1120" cy="80" r="280" fill="#2563eb" opacity=".13"/>
  <circle cx="120" cy="620" r="230" fill="#f97316" opacity=".08"/>
  <rect x="80" y="86" width="10" height="468" rx="5" fill="url(#accent)"/>
  <g transform="translate(144 122)">
    <text x="0" y="0" fill="#fb923c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">MAVEN PLUGIN</text>
    <text x="0" y="118" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-3">OpenCleanup</text>
    <rect x="0" y="154" width="610" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="222" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30">Deterministic Java source cleanup</text>
    <text x="0" y="268" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30">for consistent, reviewable builds.</text>
    <g transform="translate(0 352)">
      <rect width="208" height="48" rx="24" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="104" y="31" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600">Java 21+</text>
      <rect x="224" width="226" height="48" rx="24" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="337" y="31" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600">Lombok-aware</text>
      <rect x="466" width="194" height="48" rx="24" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".16"/>
      <text x="563" y="31" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600">103 rules</text>
    </g>
  </g>
  <g transform="translate(960 206)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 0H30C13 0 0 13 0 30v96c0 17-13 30-30 30 17 0 30 13 30 30v96c0 17 13 30 30 30h40" stroke="#fb923c" stroke-width="18"/>
    <path d="M170 0h40c17 0 30 13 30 30v96c0 17 13 30 30 30-17 0-30 13-30 30v96c0 17-13 30-30 30h-40" stroke="#60a5fa" stroke-width="18"/>
    <path d="M54 166l42 42 88-104" stroke="#f8fafc" stroke-width="18"/>
  </g>
</svg>
